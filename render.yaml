services:
  - type: web
    name: irich-global-tech
    runtime: python
    rootDir: web_page
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: irich-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SERVE_MEDIA_WITH_DJANGO
        value: "true"
    disk:
      name: irich-media
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: irich-db
    databaseName: irich
    user: irich
